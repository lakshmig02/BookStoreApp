<div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
  <div class="flex items-center gap-3">
    <span class="grid size-10 place-items-center rounded-xl bg-indigo-600 text-white shadow-sm">
      <i class="pi pi-book text-lg"></i>
    </span>
    <div>
      <h1 class="text-lg font-semibold leading-tight text-slate-900">Book Store</h1>
      <p class="text-xs text-slate-500">Inventory manager</p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <label for="genre-filter" class="hidden text-sm font-medium text-slate-600 sm:block">Genre</label>
    <p-select
      inputId="genre-filter"
      ariaLabel="Filter by genre"
      [options]="options()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selected()"
      (ngModelChange)="select($event)"
      class="w-56"
    >
      <ng-template #item let-option>
        <div class="flex w-full items-center justify-between gap-4">
          <span>{{ option.label }}</span>
          @if (option.count !== null) {
            <span class="rounded-full bg-slate-100 px-2 text-xs tabular-nums text-slate-600">{{ option.count }}</span>
          }
        </div>
      </ng-template>
    </p-select>
  </div>
</div>
